<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#f5f5f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="帕拉" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <title>帕拉</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="icon-btn left" id="backBtn" aria-label="返回" title="返回">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="contact-title">
        <div class="name-row"><span class="contact-name">帕拉</span><span class="status-dot" id="statusDot"></span></div>
        <div class="subtitle" id="subtitle">在线</div>
      </div>
      <button class="icon-btn right" id="menuBtn" aria-label="更多" title="更多">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      </button>
    </header>

    <section class="chat" id="chat" aria-live="polite"></section>

    <div class="typing" id="typing" hidden>
      <div class="avatar para-avatar">帕</div>
      <div class="typing-bubble"><i></i><i></i><i></i></div>
    </div>

    <footer class="composer-wrap">
      <div class="composer">
        <button class="round-btn" id="voiceBtn" aria-label="语音输入">
          <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5.5 11.5A6.5 6.5 0 0 0 12 18a6.5 6.5 0 0 0 6.5-6.5M12 18v3M9 21h6"/></svg>
        </button>
        <textarea id="input" rows="1" autocomplete="off" enterkeyhint="send" placeholder="说点什么"></textarea>
        <button class="round-btn" id="plusBtn" aria-label="更多功能">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        </button>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
      <div class="safe-bottom"></div>
    </footer>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="profile-row">
      <div class="avatar para-avatar big">帕</div>
      <div><div class="profile-name">帕拉</div><div class="profile-note">独立聊天入口 · 本地保存记录</div></div>
    </div>
    <button class="sheet-item" id="installBtn">添加到手机主屏幕</button>
    <button class="sheet-item" id="exportBtn">导出聊天记录</button>
    <button class="sheet-item danger" id="clearBtn">清空本机聊天记录</button>
    <button class="sheet-item" id="closeSheetBtn">取消</button>
  </section>

  <dialog id="infoDialog">
    <div class="dialog-body">
      <h3>装到 iPhone 主屏幕</h3>
      <p>用 Safari 打开这个地址，点底部“分享”，再选“添加到主屏幕”。之后它会像独立 App 一样全屏打开。</p>
      <button id="dialogOk">知道了</button>
    </div>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
